name: ci

on:
  push:
    branches: [main]
  pull_request:

# The job reads the repository and nothing else (security review 2026-11-14, SC-11).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # GPU colours read back in Chrome (preinstalled on the runner)
      - run: npm run test:browser
